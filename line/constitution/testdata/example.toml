# A fully annotated line constitution. `line init` writes a subset of this;
# every section below is parsed by constitution.Parse (see TestExampleParses).

# trust: who may sign evidence.
[trust]
# "none": signatures are verified but checks may run host-locally.
# "attest": checks must run in a container runner (see [runner]).
level = "attest"

# One entry per witness/station key. roles limits what the key may attest as
# (maker, andon, kaizen, gemba, viceroy, heijunka); empty or absent means any role.
[[trust.keys]]
name = "maker-1"
public_key = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="   # base64 ed25519 public key (placeholder here)
roles = ["maker"]

# runner: where required checks run.
[runner]
kind = "container"        # "local" or "container"
engine = "docker"         # container only; default docker
image = "sweatshop-station:dev"  # required for kind = "container"
# Optional resource ceilings for container runs.
memory = "4g"
pids = 1024
cpus = "2"

# checks.required: every check must pass before the merge guard lands a commit.
[checks]
timeout = "30m"           # per-check bound; default 30m
# A commit is docs-only when every path it changes matches one of these (same
# syntax as guards.paths). Checks with skip_for_docs_only are then skipped, and
# the attestation records the skip; mixed commits run every check.
docs_paths = ["docs/**", "*.md"]

[[checks.required]]
name = "ci"
command = "just ci"
skip_for_docs_only = true

# guards.paths: paths only the listed roles may change. First match wins;
# a trailing /** matches a directory and everything beneath it.
[[guards.paths]]
pattern = "justfile"
roles = ["gemba"]

[[guards.paths]]
pattern = "station/**"
roles = ["gemba"]

# guards.blobs: the merge guard rejects a commit that adds or changes a blob
# over max_bytes (default 1 MiB) or an executable binary (ELF, Mach-O, PE),
# unless the path matches allow (same syntax as guards.paths patterns).
[guards.blobs]
max_bytes = 1048576
allow = ["testdata/**"]

# sovereign: the king, the only identity whose channel messages carry authority.
[sovereign]
name = "alice"
discord = "123456789012345678"   # Discord user ID (digits only)

# channel: where the king and the viceroy talk.
[channel]
kind = "discord"
channel = "223456789012345678"   # Discord channel ID (digits only)

# viceroy: what the viceroy may do on its own.
[viceroy]
succession = true   # a successor viceroy may take over from its predecessor

# Labels the viceroy may add and remove on cards, beyond line-gave-up and
# needs:*, which it may always touch. A trailing * matches a prefix.
labels = ["obsolete", "triage:*"]

# Longest lifetime of a presigned link to a kaizen report; default 1h.
presign_max_ttl = "2h"

# A delegation lets the viceroy offer matching cards without the king. A card
# matches by issue type, or by having parent in its ancestor chain.
[[viceroy.delegations]]
offer = "line"
types = ["bug", "chore"]

[[viceroy.delegations]]
offer = "line"
parent = "sweatshop-0mw"

# A close delegation lets the viceroy close cards once their decision is
# commented. It is bounded by an id list, a parent, issue types, or labels.
# Prefer types: any agent can add a label, but a card's type is harder to game.
[[viceroy.delegations]]
close = true
ids = ["sweatshop-0mw.1.4", "sweatshop-0mw.1.7"]

[[viceroy.delegations]]
close = true
types = ["chore"]
labels = ["obsolete"]

# Parked cards the viceroy may close once it has commented the decision. all =
# true requires every listed category to match, except_labels carves cards out
# (andon cards are bugs, so only their label tells them apart), and expires is
# the king's chosen end of the grant.
[[viceroy.delegations]]
close = true
all = true
types = ["bug", "task", "chore"]
labels = ["line-gave-up"]
except_labels = ["andon", "line-proposed"]
expires = 2027-01-19T00:00:00Z

# How code is synced. Exactly one authoritative remote (the line remote):
# agents read from it and land to it. Storage mirrors are write-only and
# fast-forward-only; they publish, and the line never reads from them or
# relies on the host's features. Push credentials stay on the host.
[[remotes]]
name = "line"
kind = "authoritative"

[[remotes]]
name = "github"
kind = "storage"
url = "git@github.com:Fewbytes/sweatshop.git"
# publish defaults to master, tags and attestations.
publish = ["refs/heads/master", "refs/tags/*", "refs/sweatshop/*"]
